<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px 20px;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 120px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #response {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            min-height: 50px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 StudyBuddy AI</h1>

        <p class="subtitle">
            Your friendly Python learning companion
        </p>

        <textarea
            id="topic"
            placeholder="What Python concept are you struggling with?">
        </textarea>

        <button onclick="explainTopic()">
            Explain It
        </button>

        <div id="response">
            Your explanation will appear here.
        </div>

    </div>

    <script>
        function explainTopic() {

            const topic = document.getElementById("topic").value;
            const response = document.getElementById("response");

            if (!topic.trim()) {
                response.innerHTML = "Please enter a Python topic first.";
                return;
            }

            response.innerHTML =
                "🤖 StudyBuddy is thinking about: <strong>" +
                topic +
                "</strong><br><br>" +
                "Our AI explanation will appear here soon!";
        }
    </script>

</body>
</html>
